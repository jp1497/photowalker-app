# Photowalker local development stack
# Run: docker-compose up -d
# See Design/PRD_v2.md and Design/IMPLEMENTATION_ROADMAP.md

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: photowalker
      POSTGRES_PASSWORD: photowalker
      POSTGRES_DB: photowalker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photowalker -d photowalker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: {}

# Photowalker local development stack
# Run: docker-compose up -d
# See Design/PRD_v2.md and Design/IMPLEMENTATION_ROADMAP.md

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://photowalker:photowalker@postgres:5432/photowalker
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: photowalker
      POSTGRES_PASSWORD: photowalker
      POSTGRES_DB: photowalker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photowalker -d photowalker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Thumbnail worker (Step 4.3). Requires backend/.env with all Settings; REDIS_URL/DATABASE_URL overridden here.
  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://photowalker:photowalker@postgres:5432/photowalker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: sh -c "pip install -q -r requirements.txt && rq worker thumbnails"

volumes:
  postgres_data: {}

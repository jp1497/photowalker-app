# Alembic configuration. See Design/PRD_v2.md - Migration Strategy.
# Use DATABASE_URL env var to override (e.g. in CI). Default for local dev.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Use postgresql+asyncpg for async migrations (env.py uses async engine).
# Override with DATABASE_URL in environment.
sqlalchemy.url = postgresql+asyncpg://photowalker:photowalker@localhost:5432/photowalker

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

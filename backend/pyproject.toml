[project]
name = "photowalker-api"
version = "0.1.0"
description = "Photowalker API"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
per-file-ignores = {
    "__init__.py" = ["F401"],
    "app/models/*.py" = ["F821"],  # Forward refs in Mapped[] for relationships
}

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
